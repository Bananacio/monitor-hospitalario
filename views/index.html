<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Hospitalario - Alertas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Monitor Hospitalario</h1>
    
    <div class="status-card">
      <h2>Último Ritmo Medido</h2>
      <div id="bpm-display">-- BPM</div>
      <p id="estado-display">Esperando datos...</p>
    </div>

    <h2>Historial de Alertas</h2>
    <div id="lista-alertas" class="alertas-container">
      <!-- Las alertas enviadas por la Raspberry Pi se agregarán acá dinámicamente -->
    </div>
  </div>

  <!-- Cliente de Socket.io provisto directamente por el servidor Node.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
